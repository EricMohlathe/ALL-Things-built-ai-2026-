[workspace]
resolver = "2"
members = ["godmode_engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["GODMODE_OFEA Platform Team"]
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
