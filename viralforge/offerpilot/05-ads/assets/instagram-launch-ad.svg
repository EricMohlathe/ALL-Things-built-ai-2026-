<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.16" r="0.7"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.34"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0A0E18"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(80,86)">
    <rect width="58" height="58" rx="15" fill="url(#bc)"/>
    <text x="29" y="40" font-size="30" text-anchor="middle" fill="#04122b" font-weight="700">✈</text>
    <text x="78" y="40" font-size="32" fill="#EAF0FB" font-weight="700">OfferPilot</text>
  </g>

  <!-- eyebrow -->
  <g transform="translate(80,200)">
    <rect width="360" height="46" rx="23" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="26" y="30" font-size="21" fill="#22D3EE" font-weight="600" letter-spacing="2">BEAT THE ATS</text>
  </g>

  <!-- headline -->
  <text x="80" y="350" font-size="74" fill="#EAF0FB" font-weight="700">Your CV is being</text>
  <text x="80" y="436" font-size="74" fill="#EAF0FB" font-weight="700">rejected by a</text>
  <text x="80" y="522" font-size="80" fill="url(#bc)" font-weight="700">robot. 🤖</text>

  <!-- subhead -->
  <text x="80" y="610" font-size="34" fill="#93A1B8" font-weight="500">~75% of CVs never reach a human.</text>
  <text x="80" y="654" font-size="34" fill="#93A1B8" font-weight="500">Beat the ATS. Land the interview.</text>

  <!-- ATS score ring -->
  <g transform="translate(760,760)">
    <circle cx="120" cy="120" r="110" fill="none" stroke="#22304a" stroke-width="22"/>
    <circle cx="120" cy="120" r="110" fill="none" stroke="#22C55E" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="635" stroke-dashoffset="51" transform="rotate(-90 120 120)"/>
    <text x="120" y="118" font-size="72" text-anchor="middle" fill="#22C55E" font-weight="700">92</text>
    <text x="120" y="158" font-size="24" text-anchor="middle" fill="#93A1B8">/100 ATS</text>
  </g>
  <!-- before chip -->
  <g transform="translate(80,790)">
    <rect width="300" height="64" rx="14" fill="#131A2A" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="20" y="40" font-size="26" fill="#EF4444" font-weight="600">Before: 41 · Rejected</text>
  </g>
  <g transform="translate(80,866)">
    <rect width="300" height="64" rx="14" fill="#131A2A" stroke="#22C55E" stroke-opacity="0.5"/>
    <text x="20" y="40" font-size="26" fill="#22C55E" font-weight="600">After: 92 · Interview</text>
  </g>

  <!-- CTA -->
  <g transform="translate(80,1000)">
    <rect width="470" height="96" rx="20" fill="url(#bc)"/>
    <text x="235" y="62" font-size="34" text-anchor="middle" fill="#04122b" font-weight="700">Scan my CV — free →</text>
  </g>

  <text x="80" y="1150" font-size="28" fill="#22D3EE" font-weight="600">💵 Land remote jobs that pay in US dollars</text>

  <g transform="translate(80,1255)">
    <text x="0" y="0" font-size="26" fill="#93A1B8" font-weight="500">🌍 Built in South Africa · 🇺🇸 🇨🇦 🇮🇳 🇳🇬 🇵🇰 🇦🇺 worldwide</text>
    <text x="0" y="42" font-size="20" fill="#566179">We improve your odds and do the work — a job is never guaranteed.</text>
  </g>
</svg>
