<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6A2C"/><stop offset="1" stop-color="#FF9A3D"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.7"><stop offset="0" stop-color="#FF6A2C" stop-opacity="0.22"/><stop offset="1" stop-color="#FF6A2C" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0B0B0F"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <!-- logo -->
  <g transform="translate(90,84)">
    <rect width="52" height="52" rx="14" fill="url(#orange)"/>
    <text x="26" y="37" font-size="30" text-anchor="middle" fill="#1a0c02" font-weight="700">⚡</text>
    <text x="70" y="36" font-size="30" fill="#F4F4F6" font-weight="700">ViralForge</text>
  </g>
  <!-- slide counter -->
  <text x="990" y="120" font-size="28" text-anchor="end" fill="#9A9AA8" font-weight="600">4 / 7</text>
  <!-- progress bar -->
  <rect x="90" y="150" width="900" height="6" rx="3" fill="#1E1E29"/>
  <rect x="90" y="150" width="514" height="6" rx="3" fill="url(#orange)"/>
  <!-- label -->
  <text x="90" y="360" font-size="30" fill="#FF6A2C" font-weight="600" letter-spacing="4">EXAMPLE</text>
  <text x="90" y="560" font-size="98" font-weight="700" fill="#F4F4F6">Old free trials</text>
  <text x="90" y="682" font-size="98" font-weight="700" fill="#F4F4F6">you forgot to</text>
  <text x="90" y="804" font-size="98" font-weight="700" fill="url(#orange)">cancel? Gone.</text>
  <text x="90" y="1180" font-size="40" fill="#FF6A2C" font-weight="600">Swipe  →</text>
  <text x="90" y="1290" font-size="22" fill="#5f5f6b">ViralForge · faceless money tips</text>
</svg>
