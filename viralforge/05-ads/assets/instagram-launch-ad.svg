<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A2C"/><stop offset="1" stop-color="#FF9A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#FF6A2C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF6A2C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="1350" fill="#0B0B0F"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(80,90)">
    <rect width="58" height="58" rx="16" fill="url(#orange)"/>
    <text x="29" y="42" font-size="36" text-anchor="middle" fill="#1a0c02" font-weight="700">⚡</text>
    <text x="78" y="42" font-size="34" fill="#F4F4F6" font-weight="700">ViralForge</text>
  </g>

  <!-- eyebrow -->
  <g transform="translate(80,210)">
    <rect width="430" height="48" rx="24" fill="#FF6A2C" fill-opacity="0.12" stroke="#FF6A2C" stroke-opacity="0.3"/>
    <text x="30" y="31" font-size="22" fill="#FF6A2C" font-weight="600" letter-spacing="2">FACELESS · AI-POWERED · GLOBAL</text>
  </g>

  <!-- headline -->
  <text x="80" y="380" font-size="86" fill="#F4F4F6" font-weight="700">Make your first</text>
  <text x="80" y="486" font-size="118" fill="url(#orange)" font-weight="700">$500/week</text>
  <text x="80" y="588" font-size="86" fill="#F4F4F6" font-weight="700">with faceless</text>
  <text x="80" y="676" font-size="86" fill="#F4F4F6" font-weight="700">AI content.</text>

  <!-- subhead -->
  <text x="80" y="760" font-size="34" fill="#9A9AA8" font-weight="500">5 tools · a 30-day plan · the DM funnel that</text>
  <text x="80" y="806" font-size="34" fill="#9A9AA8" font-weight="500">turns comments into cash. No face needed.</text>

  <!-- phone mockup hint -->
  <g transform="translate(700,860)">
    <rect x="0" y="0" width="300" height="430" rx="40" fill="#15151D" stroke="#FF6A2C" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="22" y="26" width="256" height="60" rx="14" fill="#1E1E29"/>
    <rect x="36" y="44" width="150" height="12" rx="6" fill="url(#orange)"/>
    <rect x="22" y="108" width="256" height="86" rx="14" fill="#1E1E29"/>
    <rect x="22" y="212" width="256" height="86" rx="14" fill="#1E1E29"/>
    <rect x="22" y="316" width="256" height="86" rx="14" fill="#1E1E29"/>
    <circle cx="58" cy="151" r="16" fill="#FF6A2C" fill-opacity="0.3"/>
    <circle cx="58" cy="255" r="16" fill="#FF6A2C" fill-opacity="0.3"/>
    <circle cx="58" cy="359" r="16" fill="#FF6A2C" fill-opacity="0.3"/>
  </g>

  <!-- CTA button -->
  <g transform="translate(80,900)">
    <rect width="430" height="96" rx="20" fill="url(#orange)"/>
    <text x="215" y="62" font-size="36" text-anchor="middle" fill="#1a0c02" font-weight="700">Start free →</text>
  </g>

  <!-- get paid in USD chip -->
  <g transform="translate(80,1030)">
    <text x="0" y="34" font-size="30" fill="#FFD166" font-weight="600">💵 Create locally — get paid in US dollars</text>
  </g>

  <!-- geo footer -->
  <g transform="translate(80,1255)">
    <text x="0" y="0" font-size="26" fill="#9A9AA8" font-weight="500">🌍 Built in South Africa · 🇺🇸 🇬🇧 🇮🇳 🇳🇬 🇵🇰 🇵🇭 🇦🇺 worldwide</text>
    <text x="0" y="42" font-size="20" fill="#5f5f6b">$500/week is a goal, not a guarantee — results depend on effort.</text>
  </g>
</svg>
