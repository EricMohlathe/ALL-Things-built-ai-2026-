name: Build cTrader .algo

# Builds GODMODE_OFEA.algo on every push to the cTrader source. Output is
# uploaded as a GitHub Actions artifact that operators (especially Mac users
# who can't compile locally) can download directly.
#
# Runs on ubuntu-latest (free runner) - dotnet + cTrader.Automate NuGet
# work fine on Linux; no Windows runner required.

on:
  push:
    branches: ["**"]
    paths:
      - "ctrader/**"
      - "ctrader-algo/**"
      - ".github/workflows/ctrader-build.yml"
  pull_request:
    paths:
      - "ctrader/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x

      - name: Restore + build
        working-directory: ctrader/GODMODE_OFEA
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Package as .algo
        working-directory: ctrader/GODMODE_OFEA
        run: |
          BIN="bin/Release/net6.0"
          if [ ! -f "$BIN/GODMODE_OFEA.dll" ]; then
            echo "::error::Build did not produce GODMODE_OFEA.dll under $BIN"
            exit 1
          fi
          printf '{"Name":"GODMODE_OFEA","Version":"1.1.0","Description":"Order-flow EA","Type":"Robot"}\n' > "$BIN/Manifest.json"
          mkdir -p stage_algo
          cp "$BIN/GODMODE_OFEA.dll" stage_algo/
          cp "$BIN/Manifest.json" stage_algo/
          ALGO="GODMODE_OFEA.algo"
          rm -f "$ALGO"
          cd stage_algo && zip -r "../$ALGO" . && cd ..
          if [ ! -f "$ALGO" ]; then
            echo "::error::Failed to produce $ALGO"
            exit 1
          fi
          SIZE=$(stat -c%s "$ALGO")
          echo "Built $ALGO ($SIZE bytes)"

      - name: Upload .algo artifact
        uses: actions/upload-artifact@v4
        with:
          name: GODMODE_OFEA-algo
          path: ctrader/GODMODE_OFEA/GODMODE_OFEA.algo
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          ALGO="ctrader/GODMODE_OFEA/GODMODE_OFEA.algo"
          if [ -f "$ALGO" ]; then
            SIZE=$(stat -c%s "$ALGO")
            echo "## cTrader build succeeded" >> $GITHUB_STEP_SUMMARY
            echo "Artifact: GODMODE_OFEA.algo ($SIZE bytes)" >> $GITHUB_STEP_SUMMARY
            echo "Mac users: download from the Artifacts section, unzip, drop into Mac cTrader via Automate > Add cBot > Add Existing." >> $GITHUB_STEP_SUMMARY
          fi
