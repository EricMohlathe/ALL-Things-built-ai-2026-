name: Build cTrader .algo

# Builds GODMODE_OFEA.algo on every push to the cTrader source. Output is
# uploaded as a GitHub Actions artifact that operators (especially Mac users
# who can't compile locally) can download directly.
#
# This workflow does NOT run on Linux/Mac runners — cTrader's NuGet package
# is Windows-only.

on:
  push:
    branches: ["**"]
    paths:
      - "ctrader/**"
      - "ctrader-algo/**"
      - ".github/workflows/ctrader-build.yml"
  pull_request:
    paths:
      - "ctrader/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x

      - name: Restore + build
        working-directory: ctrader/GODMODE_OFEA
        shell: pwsh
        run: |
          # Restore NuGet packages (cTrader.Automate). If your broker still
          # ships the legacy cAlgo.API package, edit GODMODE_OFEA.csproj per
          # the comment in that file.
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Package as .algo
        working-directory: ctrader/GODMODE_OFEA
        shell: pwsh
        run: |
          # cTrader's .algo file format is a zip containing the assembly DLL
          # plus a small manifest. The official Desktop IDE wraps this in
          # signed metadata; the CI build is functionally equivalent but
          # unsigned.
          $bin = "bin/Release/net6.0"
          if (-not (Test-Path "$bin/GODMODE_OFEA.dll")) {
            Write-Error "Build did not produce GODMODE_OFEA.dll under $bin"
            exit 1
          }

          # Manifest. cTrader Desktop reads minimal metadata from this file.
          $manifest = @{
            Name        = "GODMODE_OFEA"
            Version     = "1.1.0"
            Description = "Order-flow EA — see brief §1–§25"
            Type        = "Robot"
          } | ConvertTo-Json
          $manifest | Out-File -Encoding utf8 "$bin/Manifest.json"

          # Stage all files we want in the .algo.
          $stage = "stage_algo"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$bin/GODMODE_OFEA.dll" $stage/
          Copy-Item "$bin/Manifest.json"   $stage/

          # Zip and rename to .algo.
          $algo = "GODMODE_OFEA.algo"
          if (Test-Path $algo) { Remove-Item $algo }
          Compress-Archive -Path "$stage/*" -DestinationPath "$algo.zip"
          Rename-Item "$algo.zip" $algo

          # Sanity check.
          if (-not (Test-Path $algo)) {
            Write-Error "Failed to produce $algo"
            exit 1
          }
          $size = (Get-Item $algo).Length
          Write-Host "Built $algo ($size bytes)"

      - name: Upload .algo artifact
        uses: actions/upload-artifact@v4
        with:
          name: GODMODE_OFEA-algo
          path: ctrader/GODMODE_OFEA/GODMODE_OFEA.algo
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        shell: pwsh
        run: |
          $algoPath = "ctrader/GODMODE_OFEA/GODMODE_OFEA.algo"
          if (Test-Path $algoPath) {
            $size = (Get-Item $algoPath).Length
            "## ■ cTrader build succeeded" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Artifact: ``GODMODE_OFEA.algo`` ($size bytes)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Mac users: download from the **Artifacts** section above, unzip, and drop into Mac cTrader via **Automate → + Add cBot → Add Existing**." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
