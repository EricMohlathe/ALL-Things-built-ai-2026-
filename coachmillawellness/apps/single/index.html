<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="utf-8" />
    <!--
      Build 1 — CoachMillaWellness.html (§6).

      ONE file, zero external requests. It has to open from a phone's Files app,
      a USB stick, or a WhatsApp forward, so nothing here may reference a network
      resource: no CDN, no webfont URL, no analytics.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0E0F1A" />
    <meta
      name="description"
      content="Coach Milla Wellness — a coaching practice cockpit. Clients, sessions, the Living Wheel and content coherence, offline and yours forever."
    />
    <title>Coach Milla Wellness</title>

    <!--
      The wheel, as a data URI.

      A favicon is the one request a browser makes without being asked, so an
      external icon file would break §6's zero-external-requests rule the moment
      the file is served over http rather than opened from disk — and leave a 404
      in the console of every page load. Inlining it keeps the promise exactly:
      one file, no network, and a tab icon whether she opens it from her Files
      app or from a URL.

      The glyph is the Living Wheel because that is what the product is: a hub,
      ten spokes, and a rim scored unevenly the way a real one always is.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E0F1A'/%3E%3Cg stroke='%239A7BFF' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M16 16 16 5.5'/%3E%3Cpath d='M16 16 22.2 7.5'/%3E%3Cpath d='M16 16 26.5 12.6'/%3E%3Cpath d='M16 16 26.5 19.4'/%3E%3Cpath d='M16 16 22.2 24.5'/%3E%3Cpath d='M16 16 16 26.5'/%3E%3Cpath d='M16 16 9.8 24.5'/%3E%3Cpath d='M16 16 5.5 19.4'/%3E%3Cpath d='M16 16 5.5 12.6'/%3E%3Cpath d='M16 16 9.8 7.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23F5A524' stroke-width='1.6' opacity='.85'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%239A7BFF'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #f4f2ed">
        Coach Milla Wellness needs JavaScript to run. It stores everything on this device and never
        sends your data anywhere.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
